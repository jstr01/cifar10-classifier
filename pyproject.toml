[project]
name = "cifar10-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fiftyone>=1.11.0",
    "mlflow>=3.11.1",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
]

[dependency-groups]
dev = [
    "black>=25.12.0",
    "isort>=7.0.0",
    "pylint>=4.0.4",
]

# allow pylint line length to be 120 and ignore missing docstrings
[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120
disable = [
    "missing-docstring",
]

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"